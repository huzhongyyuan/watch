defaults:
  - _self_
  - model: watch/watch_pl_demo
  - network: watch/relative_transformer
  - endecoder: watch/v3_1_amass_human_bedlam_cam

pipeline_watch:
  _target_: core.model.watch.pipeline.watch_pipeline.Pipeline
  args_denoiser3d: ${network}
  args:
    endecoder_opt: ${endecoder}
    normalize_cam_angvel: True
    weights: null
    static_conf: null

