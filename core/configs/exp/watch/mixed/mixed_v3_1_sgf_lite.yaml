# @package _global_
# WATCH v3_1-SGF-lite: original v3_1 backbone with inference-only conservative
# geometric trajectory fusion. This config is for evaluation/finetune experiments;
# use ckpt_path to evaluate an existing v3_1 checkpoint.
defaults:
    - override /data: mocap/trainX_testY
    - override /model: watch/watch_pl
    - override /endecoder: watch/v3_1_amass_human_bedlam_cam
    - override /optimizer: adamw_2e-4
    - override /scheduler_cfg: epoch_half_200_350
    - override /train_datasets:
          - pure_motion_amass/v11
          - imgfeat_bedlam/v2
          - imgfeat_h36m/v1
          - imgfeat_3dpw/v1
    - override /test_datasets:
          - emdb1/v1_fliptest
          - emdb2/v1_fliptest
          - rich/all
          - 3dpw/fliptest
    - override /callbacks:
          - simple_ckpt_saver/every10e_top100
          - prog_bar/prog_reporter_every0.1
          - train_speed_timer/base
          - lr_monitor/pl
          - metric_emdb1
          - metric_emdb2
          - metric_rich
          - metric_3dpw
    - override /network: watch/relative_transformer

exp_name_base: mixed
exp_name_var: "test_v3_1_sgf_lite"
exp_name: ${exp_name_base}${exp_name_var}
data_name: watch_mixed_v3

pipeline_watch:
    _target_: core.model.watch.pipeline.watch_pipeline.Pipeline
    args_denoiser3d: ${network}
    args:
        endecoder_opt: ${endecoder}
        normalize_cam_angvel: True
        weights:
            cr_j3d: 500.
            transl_c: 1.
            cr_verts: 500.
            j2d: 1000.
            verts2d: 1000.
            transl_w_human: 1.
            transl_w_cam: 1.
            transl_infer_human_cam: 0.
            static_conf_bce: 1.
        static_conf:
            vel_thr: 0.15
        sgf_lite:
            enabled: True
            alpha_cap: 0.25
            cam_speed_thr: 0.08
            cam_speed_gain: 10.0
            ratio_thr: 1.3
            ratio_gain: 4.0
            bbox_delta_thr: 0.04
            bbox_gain: 20.0
            geom_gap_thr: 0.25
            geom_gap_gain: 6.0
            seq_cam_speed_thr: 0.03
            seq_ratio_thr: 1.1
            seq_bbox_delta_thr: 0.035
            smooth_sigma: 5.0
            max_delta: 0.6

data:
    loader_opts:
        train:
            batch_size: 128
            num_workers: 8

pl_trainer:
    precision: 16-mixed
    log_every_n_steps: 50
    gradient_clip_val: 0.5
    max_epochs: 500
    check_val_every_n_epoch: 10
    devices: 2

logger:
    _target_: pytorch_lightning.loggers.TensorBoardLogger
    save_dir: ${output_dir}
    name: ""
    version: "tb"
