# @package _global_
defaults:
    - override /data: mocap/trainX_testY
    - override /model: watch/watch_pl
    - override /endecoder: watch/v3_1_amass_human_bedlam_cam
    - override /optimizer: adamw_2e-4
    - override /scheduler_cfg: epoch_half_200_350
    - override /train_datasets:
          - pure_motion_amass/v11
          - imgfeat_3db_bedlam2/v1
          - imgfeat_h36m_3db/v1
          - pure_motion_mib/v11
          - pure_motion_mib_700h_00/v11
          - pure_motion_mib_700h_01/v11
          - pure_motion_mib_700h_02/v11
          - pure_motion_mib_700h_03/v11
          - pure_motion_mib_700h_04/v11
        # #   - pure_motion_mib_700h_05/v11
        #   - pure_motion_mib_700h_06/v11
        #   - pure_motion_mib_700h_07/v11
        #   - pure_motion_mib_700h_08/v11
        #   - pure_motion_mib_700h_09/v11
        #   - pure_motion_mib_700h_10/v11
    - override /test_datasets:
          - emdb1_3db/v1
          - emdb2_3db/v1
        #   - rich/all
        #   - 3dpw/fliptest
    - override /callbacks:
          - simple_ckpt_saver/every10e_top100
          - prog_bar/prog_reporter_every0.1
          - train_speed_timer/base
          - lr_monitor/pl
          - metric_emdb1
          - metric_emdb2
          - metric_rich
          - metric_3dpw
    - override /network: watch/relative_transformer

exp_name_base: mixed
exp_name_var: "train_v7"
exp_name: ${exp_name_base}${exp_name_var}
data_name: watch_mixed_v8

pipeline_watch:
    _target_: core.model.watch.pipeline.watch_pipeline.Pipeline
    args_denoiser3d: ${network}
    args:
        endecoder_opt: ${endecoder}
        normalize_cam_angvel: True
        weights:
            cr_j3d: 500.
            transl_c: 1.
            cr_verts: 500.
            j2d: 1000.
            verts2d: 1000.

            transl_w_human: 1.
            transl_w_cam: 1.
            transl_infer_human_cam: 0.
            static_conf_bce: 1.

        static_conf:
            vel_thr: 0.15

data:
    loader_opts:
        train:
            batch_size: 512
            num_workers: 24

pl_trainer:
    precision: 16-mixed
    log_every_n_steps: 50
    gradient_clip_val: 0.5
    max_epochs: 500
    check_val_every_n_epoch: 10
    devices: 8

logger:
    _target_: pytorch_lightning.loggers.TensorBoardLogger
    save_dir: ${output_dir} # /save_dir/name/version/sub_dir
    name: ""
    version: "tb" # merge name and version
