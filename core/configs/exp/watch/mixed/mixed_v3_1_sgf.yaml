# @package _global_
# WATCH v3_1-SGF: Scale-aware Geometric Fusion mainline.
# Based on v3_1 data/losses, with joint camera embedding, camera cross-attention,
# exact-yaw inference, and learned human-rollout/geometric-trajectory fusion.
defaults:
    - override /data: mocap/trainX_testY
    - override /model: watch/watch_pl
    - override /endecoder: watch/v3_1_amass_human_bedlam_cam
    - override /optimizer: adamw_1e-4
    - override /scheduler_cfg: epoch_half_200_350
    - override /train_datasets:
          - pure_motion_amass/v11
          - imgfeat_bedlam/v2
          - imgfeat_h36m/v1
          - imgfeat_3dpw/v1
    - override /test_datasets:
          - emdb1/v1_fliptest
          - emdb2/v1_fliptest
          - rich/all
          - 3dpw/fliptest
    - override /callbacks:
          - simple_ckpt_saver/every10e_top100
          - prog_bar/prog_reporter_every0.1
          - train_speed_timer/base
          - lr_monitor/pl
          - metric_emdb1
          - metric_emdb2
          - metric_rich
          - metric_3dpw
    - override /network: watch/relative_transformer_cam_add_cross

exp_name_base: mixed
exp_name_var: "train_v3_1_sgf"
exp_name: ${exp_name_base}${exp_name_var}
data_name: watch_mixed_v3_1_sgf

pipeline_watch:
    _target_: core.model.watch.pipeline.watch_pipeline.Pipeline
    args_denoiser3d: ${network}
    args:
        endecoder_opt: ${endecoder}
        normalize_cam_angvel: True
        use_exact_yaw: True
        weights:
            cr_j3d: 500.
            transl_c: 1.
            cr_verts: 500.
            j2d: 1000.
            verts2d: 1000.

            transl_w_human: 1.
            transl_w_cam: 1.
            transl_infer_human_cam: 0.
            static_conf_bce: 1.
            transl_accum: 1.0
            transl_fusion_gate_reg: 0.01
            transl_fusion_residual_reg: 0.001

        static_conf:
            vel_thr: 0.15

        transl_fusion:
            enabled: True
            hidden_dim: 64
            gate_bias: -8.0
            alpha_cap: 0.9
            residual_scale: 0.08
            smooth_sigma: 3.0

data:
    loader_opts:
        train:
            batch_size: 96
            num_workers: 8

pl_trainer:
    precision: 16-mixed
    log_every_n_steps: 50
    gradient_clip_val: 0.5
    max_epochs: 500
    check_val_every_n_epoch: 10
    devices: 2
    strategy: "ddp_find_unused_parameters_true"

logger:
    _target_: pytorch_lightning.loggers.TensorBoardLogger
    save_dir: ${output_dir}
    name: ""
    version: "tb"
