# @package _global_
# WATCH v3_2-GeoPhys: WATCH + DGC + Physics (incremental, no dual-stream)
# Built on top of mixed_v3_1, adds DGC layer in forward + physics loss
defaults:
    - override /data: mocap/trainX_testY
    - override /model: watch/watch_pl
    - override /endecoder: watch/v3_1_amass_human_bedlam_cam
    - override /optimizer: adamw_2e-4
    - override /scheduler_cfg: epoch_half_200_350
    - override /train_datasets:
          - pure_motion_amass/v11
          - imgfeat_bedlam/v2
          - imgfeat_h36m/v1
          - imgfeat_3dpw/v1
    - override /test_datasets:
          - emdb1/v1_fliptest
          - emdb2/v1_fliptest
          - rich/all
          - 3dpw/fliptest
    - override /callbacks:
          - simple_ckpt_saver/every10e_top100
          - prog_bar/prog_reporter_every0.1
          - train_speed_timer/base
          - lr_monitor/pl
          - metric_emdb1
          - metric_emdb2
          - metric_rich
          - metric_3dpw
    - override /network: watch/relative_transformer  # Use single-stream first; switch to dual_stream later

exp_name_base: mixed
exp_name_var: "train_v3_2_geophys"
exp_name: ${exp_name_base}${exp_name_var}
data_name: watch_mixed_v3_2_geophys

pipeline_watch:
    _target_: core.model.watch.extensions.integrated_pipeline.GeoPhysPipeline
    args_denoiser3d: ${network}
    args:
        endecoder_opt: ${endecoder}
        normalize_cam_angvel: True

        # === Extension flags === #
        use_dgc: True
        dgc_K: 3
        dgc_latent_dim: 256

        use_physics: True
        ground_y: 0.0
        physics_weight_ground: 1.0
        physics_weight_sliding: 10.0
        physics_weight_smoothness: 0.1
        physics_weight_balance: 0.5

        use_contact_head: True

        # === Original WATCH weights === #
        weights:
            cr_j3d: 500.
            transl_c: 1.
            cr_verts: 500.
            j2d: 1000.
            verts2d: 1000.
            transl_w_human: 1.
            transl_w_cam: 1.
            transl_infer_human_cam: 0.
            static_conf_bce: 1.
            # NEW: physics weight (multiplier for physics_total)
            physics_total: 5.0

        static_conf:
            vel_thr: 0.15

data:
    loader_opts:
        train:
            batch_size: 96  # smaller batch since DGC + physics adds memory
            num_workers: 8

pl_trainer:
    precision: 16-mixed
    log_every_n_steps: 50
    gradient_clip_val: 0.5
    max_epochs: 500
    check_val_every_n_epoch: 10
    devices: 2
    strategy: "ddp_find_unused_parameters_true"

logger:
    _target_: pytorch_lightning.loggers.TensorBoardLogger
    save_dir: ${output_dir}
    name: ""
    version: "tb"
