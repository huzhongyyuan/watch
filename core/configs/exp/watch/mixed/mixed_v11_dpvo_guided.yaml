# @package _global_
# WATCH with DPVO-Guided Translation Fusion
defaults:
    - override /data: mocap/trainX_testY
    - override /model: watch/watch_pl
    - override /endecoder: watch/v3_1_amass_human_bedlam_cam
    - override /optimizer: adamw_2e-4
    - override /scheduler_cfg: epoch_half_200_350
    - override /train_datasets:
          - pure_motion_amass/v11
          - imgfeat_bedlam/v2
          - imgfeat_h36m/v1
          - imgfeat_3dpw/v1
    - override /test_datasets:
          - emdb1/v1_fliptest
          - emdb2/v1_fliptest
    - override /callbacks:
          - metric_emdb1
          - metric_emdb2
    - override /network: watch/relative_transformer

exp_name_base: mixed
exp_name_var: "eval_dpvo_guided"
exp_name: 
data_name: watch_dpvo_guided

pipeline_watch:
    _target_: core.model.watch.pipeline.watch_pipeline.Pipeline
    args_denoiser3d: 
    args:
        endecoder_opt: 
        normalize_cam_angvel: True
        weights:
            cr_j3d: 500.
            transl_c: 1.
            cr_verts: 500.
            j2d: 1000.
            verts2d: 1000.
            transl_w_human: 1.
            transl_w_cam: 1.
            transl_infer_human_cam: 0.
            static_conf_bce: 1.
        static_conf:
            vel_thr: 0.15
        # DPVO-guided fusion config
        dpvo_guided_cfg:
            enabled: true
            cam_speed_thr: 0.08
            cam_speed_gain: 10.0
            human_speed_thr: 0.12
            human_speed_gain: 10.0
            bbox_delta_thr: 0.035
            bbox_gain: 18.0
            alpha_cap: 0.85
            smooth_sigma: 5.0
            seq_ratio_thr: 2.0
            seq_cam_speed_thr: 0.02
            seq_bbox_delta_thr: 0.016

data:
    loader_opts:
        train:
            batch_size: 512
            num_workers: 24

pl_trainer:
    precision: 16-mixed
    log_every_n_steps: 50
    gradient_clip_val: 0.5
    max_epochs: 500
    check_val_every_n_epoch: 10
    devices: 1

logger:
    _target_: pytorch_lightning.loggers.TensorBoardLogger
    save_dir: 
    name: ""
    version: "tb"
